[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "venv", "lib", "cache", "out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
  "E501", # line length — keep diffs focused on real issues
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["T201"]
